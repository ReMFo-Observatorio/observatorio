name: barrera

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sin-datos-internos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rechazar correos y archivos internos
        run: |
          python3 - << 'PY'
          import os, re, sys
          email = re.compile(r"[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}")
          bad = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d != ".git"]
              for name in files:
                  path = os.path.join(root, name)
                  rel = path.replace("\\", "/")
                  if rel.endswith("/.github/workflows/barrera.yml"):
                      continue
                  if "participantes-lanzamiento" in rel or "/interno/" in rel:
                      bad.append(rel)
                  text = open(path, errors="ignore").read()
                  if email.search(text) or "skipbysdk" in text.lower():
                      bad.append(rel + " (dato interno)")
          if bad:
              print("Este repositorio no admite correos ni material interno:")
              print("\n".join(bad))
              sys.exit(1)
          print("Barrera en orden.")
          PY
